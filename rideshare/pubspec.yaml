name: rideshare
description: "Rideshare App - منصة مشاركة الرحلات"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  
  # Localization
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  
  # Firebase Core
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.3
  firebase_storage: ^12.3.2
  firebase_messaging: ^15.1.3
  firebase_analytics: ^11.3.3
  firebase_app_check: ^0.3.1+4
  cloud_functions: ^5.1.3
  flutter_local_notifications: ^17.2.3
  
  # State Management
  provider: ^6.1.2  # Keep for LocalizationService
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5
  
  # UI Components
  google_fonts: ^6.2.1
  cached_network_image: ^3.4.1
  iconsax_plus: ^1.0.0
  
  # Image Handling
  image_picker: ^1.1.2
  
  # Maps & Location
  google_maps_flutter: ^2.9.0
  geolocator: ^13.0.1
  geocoding: ^3.0.0
  
  # Networking
  http: ^1.2.2
  
  # Utilities
  shared_preferences: ^2.3.2
  uuid: ^4.5.1
  timeago: ^3.7.0
  url_launcher: ^6.3.1
  
  # Social Login
  dio: ^5.9.1
  flutter_secure_storage: ^9.2.4
  socket_io_client: ^3.1.4

  # Settings Feature
  package_info_plus: ^8.1.2
  share_plus: ^10.1.3
  webview_flutter: ^4.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.9

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  uses-material-design: true
  
