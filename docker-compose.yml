# Wisoway / Rideshare - Unified Production Stack
#
# Services: postgres (PostGIS) + redis + backend (NestJS) + dashboard (Vite SPA) + nginx (reverse proxy)
#
# Usage:
#   cp .env.example .env        # then fill in real secrets
#   Place Firebase Admin JSON at rideshare-backend/config/firebase-adminsdk.json (gitignored)
#   docker compose build
#   docker compose up -d
#
# Edge entry (HTTPS, Let's Encrypt cert for vision-way.com, also covering vision-way.tech):
#   https://<host>/            -> dashboard
#   https://<host>/api/        -> backend
#   https://<host>/socket.io/  -> backend WS
# nginx mounts docker/nginx/nginx.ssl.conf by default. On a host without certs
# set NGINX_CONF=nginx.conf to serve plain HTTP instead.

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: rideshare-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-rideshare}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - rideshare-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-rideshare}"]
      interval: 10s
      timeout: 5s
      retries: 10
    # Only bind to localhost on the host - remove "127.0.0.1:" to expose externally
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"

  redis:
    image: redis:7-alpine
    container_name: rideshare-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy noeviction
    volumes:
      - redis_data:/data
    networks:
      - rideshare-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"

  backend:
    build:
      context: ./rideshare-backend
      dockerfile: Dockerfile
      target: production
    image: rideshare-backend:latest
    container_name: rideshare-backend
    restart: unless-stopped
    env_file:
      - ./rideshare-backend/.env
    environment:
      NODE_ENV: production
      PORT: 3000
      # Skip Twilio SMS during development; OTP codes are printed in backend logs.
      OTP_PROVIDER: ${OTP_PROVIDER:-local}
      # Absolute path inside the container (image has no ./config unless mounted below)
      FIREBASE_SERVICE_ACCOUNT_PATH: /app/config/firebase-adminsdk.json
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-rideshare}
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - backend_uploads:/app/uploads
      - backend_private_documents:/app/private-documents
      # FCM: service account JSON stays on the host (not baked into the image)
      - ./rideshare-backend/config/firebase-adminsdk.json:/app/config/firebase-adminsdk.json:ro
    networks:
      - rideshare-net
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  dashboard:
    build:
      context: ./rideshare-dashboard
      dockerfile: Dockerfile
      args:
        # Dashboard talks to the API through the edge nginx, so relative paths
        # avoid hard-coding a hostname into the bundle.
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
        VITE_WS_URL: ${VITE_WS_URL:-/}
        # The Firebase web app (public client config, as in the mobile app's
        # firebase_options.dart). The VAPID key comes from the Firebase console:
        # Project settings → Cloud Messaging → Web Push certificates.
        VITE_FIREBASE_API_KEY: ${VITE_FIREBASE_API_KEY:-AIzaSyD1KS8J4CKop_tqTGdM-gk1e7GsxCS-sJ4}
        VITE_FIREBASE_PROJECT_ID: ${VITE_FIREBASE_PROJECT_ID:-rideshare-5f785}
        VITE_FIREBASE_MESSAGING_SENDER_ID: ${VITE_FIREBASE_MESSAGING_SENDER_ID:-907014658060}
        VITE_FIREBASE_APP_ID: ${VITE_FIREBASE_APP_ID:-1:907014658060:web:1ffb633f83fa23e31f7629}
        VITE_FIREBASE_VAPID_KEY: ${VITE_FIREBASE_VAPID_KEY:-BObB-MOedXTxzXa0rTfFA2gR_DK2FIfMLcbUjERcE5phaX91Qy5bJHIfEFoRvZ5T8LarJ6wCHeErrUF9N6wy6JY}
    image: rideshare-dashboard:latest
    container_name: rideshare-dashboard
    restart: unless-stopped
    networks:
      - rideshare-net
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3

  nginx:
    image: nginx:1.27-alpine
    container_name: rideshare-nginx
    restart: unless-stopped
    ports:
      - "${EDGE_HTTP_PORT:-80}:80"
      - "${EDGE_HTTPS_PORT:-443}:443"
    volumes:
      - ./docker/nginx/${NGINX_CONF:-nginx.ssl.conf}:/etc/nginx/nginx.conf:ro
      - certbot_www:/var/www/certbot:ro
      - certbot_conf:/etc/letsencrypt:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      - backend
      - dashboard
    networks:
      - rideshare-net
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 5s
      retries: 3

  certbot:
    image: certbot/certbot:v2.11.0
    profiles:
      - ssl
    volumes:
      - certbot_conf:/etc/letsencrypt
      - certbot_www:/var/www/certbot

networks:
  rideshare-net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  backend_uploads:
  backend_private_documents:
  nginx_logs:
  certbot_conf:
  certbot_www:
