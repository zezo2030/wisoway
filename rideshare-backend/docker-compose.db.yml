services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: rideshare-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-rideshare}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - rideshare_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-rideshare}"]
      interval: 10s
      timeout: 5s
      retries: 10

  mongodb:
    image: mongo:7
    container_name: rideshare-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - rideshare_mongo_data:/data/db

  redis:
    image: redis:7-alpine
    container_name: rideshare-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - rideshare_redis_data:/data

volumes:
  rideshare_postgres_data:
  rideshare_mongo_data:
  rideshare_redis_data:
